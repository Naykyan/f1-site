<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F1 Encyclopédie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%8E%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f6f7;--card:#fff;--tx:#15151e;--mut:#6b6b78;--red:#e10600;--bd:#e3e3e8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15151e;--card:#1f1f2b;--tx:#f2f2f5;--mut:#9a9aa8;--bd:#33334a}}
:root[data-theme="dark"]{--bg:#15151e;--card:#1f1f2b;--tx:#f2f2f5;--mut:#9a9aa8;--bd:#33334a}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:#15151e;color:#fff;padding:14px 20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;border-bottom:4px solid var(--red)}
header a{color:#fff;text-decoration:none;font-weight:600}
header .logo{font-size:20px;font-weight:800;letter-spacing:.5px}header .logo b{color:var(--red)}
header input{margin-left:auto;padding:8px 12px;border-radius:8px;border:0;min-width:200px;font:inherit}
main{max-width:1100px;margin:0 auto;padding:24px 16px}
h1{margin:0 0 4px}h2{margin:28px 0 12px;border-left:4px solid var(--red);padding-left:10px}
.sub{color:var(--mut);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-decoration:none;color:inherit;display:block;text-align:center}
.card:hover{border-color:var(--red)}
.card img{width:100%;height:150px;object-fit:contain}
.card .n{font-weight:700;margin-top:6px}.card .m{color:var(--mut);font-size:14px}
.year{font-size:34px;font-weight:800;padding:18px 0}
.team{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:18px}
.team .top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.team .top img.logo{height:60px;max-width:160px;object-fit:contain}
.team .car{width:100%;max-width:520px;object-fit:contain}
.drivers{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:12px}
.drv{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;border:1px solid var(--bd);border-radius:10px;padding:8px}
.drv img{height:80px;width:64px;object-fit:contain}
.num{background:var(--red);color:#fff;border-radius:6px;padding:0 6px;font-weight:700;font-size:13px}
.pair{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.pair figure{margin:0;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}
.pair img{width:100%;height:220px;object-fit:contain}
figcaption{color:var(--mut);font-size:14px}
.card img.flag,h1 img.flag{height:18px;width:auto;vertical-align:middle;border-radius:2px;margin-right:6px}
.yrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px}
.yrow>img{height:90px;width:auto;max-width:120px;object-fit:contain}.yrow>img.nl{height:46px}.yrow .yy{font-weight:800;font-size:20px;min-width:56px}
.sps{display:flex;flex-wrap:wrap;gap:8px;width:100%}.spi{display:flex;gap:4px;align-items:center;border:1px solid var(--bd);border-radius:8px;padding:4px}
.spi img.fl{height:16px;width:auto;border-radius:2px}.spi img.hh{height:70px;width:auto}
.top img.eng{height:44px;width:auto;margin-left:auto}.top img.shirt{height:70px;width:auto}.lh{margin:14px 0 6px;font-size:16px}.spi img.lv{height:60px;width:auto;max-width:280px}
.ad{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.ad label{display:block;font-size:14px;color:var(--mut);margin:10px 0 3px}
.ad input,.ad select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;background:var(--bg);color:var(--tx)}
.ad button,.adi button{background:var(--red);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;margin-top:14px}
.adi button{margin:0 0 0 6px;padding:4px 10px;font-size:13px;background:transparent;color:var(--tx);border:1px solid var(--bd)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.row2{grid-template-columns:1fr}}
#adMsg{padding:10px 14px;border-radius:8px;margin:0 0 14px}#adMsg.ok{background:#d9f5df;color:#14501f}#adMsg.err{background:#fde0de;color:#8a1510}
.adi{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--bd);border-radius:10px;padding:8px;margin-bottom:8px}.adi img{height:50px;width:auto;max-width:90px;object-fit:contain}.adi .grow{flex:1;min-width:160px}
.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.tab{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:8px 14px;cursor:pointer;font:inherit}
.tab.on{background:var(--red);color:#fff;border-color:var(--red)}.tabs.sm .tab{padding:5px 12px;font-size:14px}
.cur{height:36px;width:auto;vertical-align:middle;margin-right:6px;border-radius:4px}.curw{display:block;font-size:12px;color:var(--mut);margin-top:3px}.gh{margin:18px 0 0;grid-column:1/-1}
a.link{color:var(--red);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<header>
  <a class="logo" href="#home">F1<b>·</b>Encyclopédie</a>
  <a href="#home">Saisons</a><a href="#drivers">Pilotes</a><a href="#teams">Écuries</a><a href="#podiums">Grands Prix</a><a href="#numbers">Numéros</a><a href="#admin" id="adminLink" hidden>⚙️ Admin</a>
  <input id="q" type="search" placeholder="Rechercher un pilote ou une écurie…">
</header>
<main id="app">Chargement…</main>
<script>
addEventListener('error',e=>{if(e.target.tagName==='IMG')e.target.style.visibility='hidden'},true);
const slug=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const nice=n=>{const p=n.split(' ');const i=p.findIndex(w=>w===w.toUpperCase()&&w.length>1);return i<0?n:p.slice(0,i).join(' ')+' '+p.slice(i).map(w=>w[0]+w.slice(1).toLowerCase()).join(' ')};
let DATA=[],drivers={},teams={};
const $=id=>document.getElementById(id), app=$('app');

let BASE=[],EXTRA=[],DB=null,AS=null,CAN=false,BASE_GP={},BASE_RC={},BASE_NUM={},BASE_EC={};
const clone=o=>JSON.parse(JSON.stringify(o));
const LOCAL={};
const blob=id=>id?(LOCAL[id]||'img/extra/'+id+'.webp'):null;
function index(){
  teams={};drivers={};
  DATA.forEach(s=>s.teams.forEach(t=>{const tk=slug(t.name);(teams[tk]??={name:t.name,seasons:[]}).seasons.push({year:s.year,...t});t.drivers.forEach(x=>{const k=slug(x.name);(drivers[k]??={name:x.name,seasons:[]}).seasons.push({year:s.year,team:t.name,car:t.car,...x})})}));
  for(const n in NUM)NUM[n].forEach(b=>{const k=slug(b.name);if(!drivers[k])drivers[k]={name:b.name,seasons:[],pseudo:true}});
}
function renames(ex){const r=[];ex.filter(e=>e.kind==='team').forEach(e=>(e.drivers||[]).forEach(x=>{if(x.from&&x.name&&x.from!==x.name)r.push([x.from,x.name])}));return r}
function applyExtra(base,ex){
  const D=clone(base),sea=y=>{let s=D.find(x=>x.year===y);if(!s){s={year:y,teams:[]};D.push(s)}return s};
  const team=(y,name)=>{const s=sea(y);let t=s.teams.find(x=>slug(x.name)===slug(name));if(!t){t={name,chassis:'',engine:'',logo:null,car:null,drivers:[]};s.teams.push(t)}return t};
  ex.filter(e=>e.kind==='team').forEach(e=>{const t=team(e.year,e.name);
    if(e.chassis)t.chassis=e.chassis;if(e.engine)t.engine=e.engine;if(e.logo)t.logo=blob(e.logo);if(e.car)t.car=blob(e.car);
    (e.drivers||[]).forEach(x=>{let d=t.drivers[x.idx];if(!d){d={name:x.name,number:'',photo:null,helmet:null};t.drivers.push(d)}
      if(x.name)d.name=x.name;if(x.number)d.number=x.number;if(x.photo)d.photo=blob(x.photo);if(x.helmet)d.helmet=blob(x.helmet)})});
  ex.filter(e=>e.kind==='special'&&e.t==='team').forEach(e=>team(e.year,e.name));
  renames(ex).forEach(([a,b])=>D.forEach(s=>s.teams.forEach(t=>t.drivers.forEach(d=>{if(slug(d.name)===slug(a))d.name=b}))));
  D.sort((a,b)=>b.year-a.year);return D;
}
function applyGP(g0,r0,ex){
  const G=clone(g0),R=clone(r0);
  ex.filter(e=>e.kind==='gp').forEach(e=>{
    const arr=G[e.year]||(G[e.year]=[]);let g=arr.find(x=>x.n===e.n);
    if(!g){g={n:e.n,country:'',flag:null,poster:null,sponsor:null,trophy:null,winner:null};arr.push(g);arr.sort((a,b)=>a.n-b.n)}
    if(e.country)g.country=e.country;
    for(const k of['flag','poster','sponsor','trophy','winner'])if(e[k])g[k]=blob(e[k]);
    const yr=R[e.year]||(R[e.year]={});const r=yr[e.n]||(yr[e.n]=[null,null,null,null,null,null]);
    if(e.circuit)r[0]=blob(e.circuit);if(e.practice)r[1]=blob(e.practice);if(e.qualifying)r[4]=blob(e.qualifying);
  });
  return[G,R];
}
function applySp(n0,e0,ex){
  const N=clone(n0),E=clone(e0);
  renames(ex).forEach(([a,b])=>{for(const n in N)N[n].forEach(x=>{if(slug(x.name)===slug(a))x.name=b})});
  ex.filter(e=>e.kind==='hide').forEach(h=>{
    if(h.t==='driver'){(N[h.n]||[]).forEach(b=>{if(slug(b.name)===slug(h.name))b.years.forEach(y=>{if(y.y===h.year&&y.s[h.gi])y.s[h.gi]=null})})}
    else{const k=Object.keys(E).find(n=>slug(n)===slug(h.name));const y=k&&E[k][h.year];if(y&&y.x[h.gi])y.x[h.gi]=null}
  });
  for(const n in N)N[n].forEach(b=>b.years.forEach(y=>{y.s=y.s.filter(Boolean)}));
  for(const k in E)for(const y in E[k])E[k][y].x=E[k][y].x.filter(Boolean);
  ex.filter(e=>e.kind==='team').forEach(e=>(e.drivers||[]).forEach(x=>{
    const m=String(x.number||'').match(/\d+/);if(!m||!x.name)return;
    const L=N[m[0]]||(N[m[0]]=[]);let b=L.find(z=>slug(z.name)===slug(x.name));
    let y=b&&b.years.find(z=>z.y===e.year);
    if(!y&&!(x.numImg||x.photo||x.helmet))return;
    if(!b){b={name:x.name,years:[]};L.push(b)}
    if(!y){y={y:e.year,n:null,p:null,h:null,s:[]};b.years.push(y);b.years.sort((a,c)=>c.y-a.y)}
    if(x.numImg)y.n=blob(x.numImg);if(x.photo)y.p=blob(x.photo);if(x.helmet)y.h=blob(x.helmet);
  }));
  const ent=(name,year)=>{const k=Object.keys(E).find(n=>slug(n)===slug(name))||name;const o=E[k]||(E[k]={});return o[year]||(o[year]={s:null,e:null,x:[]})};
  ex.filter(e=>e.kind==='team'&&(e.shirt||e.eng)).forEach(e=>{const y=ent(e.name,e.year);if(e.shirt)y.s=blob(e.shirt);if(e.eng)y.e=blob(e.eng)});
  ex.filter(e=>e.kind==='special').forEach(e=>{
    if(e.t==='driver'){
      const num=String(e.number||'').replace('#',''),L=N[num]||(N[num]=[]);let b=L.find(x=>slug(x.name)===slug(e.name));
      if(!b){b={name:e.name,years:[]};L.push(b)}
      let y=b.years.find(x=>x.y===e.year);if(!y){y={y:e.year,n:null,p:null,h:null,s:[]};b.years.push(y);b.years.sort((a,c)=>c.y-a.y)}
      y.s.push({f:blob(e.flag),h:(e.imgs||[]).map(blob)});
    }else ent(e.name,e.year).x.push({f:blob(e.flag),l:(e.imgs||[]).map(blob)});
  });
  return[N,E];
}
function recompute(){
  DATA=applyExtra(BASE,EXTRA);
  const g=applyGP(BASE_GP,BASE_RC,EXTRA);window.GP=g[0];window.RC=g[1];
  const s=applySp(BASE_NUM,BASE_EC,EXTRA);window.NUM=s[0];window.EC=s[1];
  Object.keys(ECS).forEach(k=>delete ECS[k]);
  index();
}
let CFG=null,EX_SHA=null,Q=Promise.resolve();
const enqueue=fn=>{const p=Q.then(fn);Q=p.catch(()=>{});return p};
const u8b64=s=>{const b=new TextEncoder().encode(s);let o='';for(let i=0;i<b.length;i+=8192)o+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(o)};
const b64u8=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const blobB64=bl=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(new Error('Lecture de l’image impossible'));r.readAsDataURL(bl)});
async function gh(path,o={}){
  const get=(o.method||'GET')==='GET';
  const url='https://api.github.com/repos/'+encodeURIComponent(CFG.owner)+'/'+encodeURIComponent(CFG.repo)+'/contents/'+path.split('/').map(encodeURIComponent).join('/')+(get?'?ref='+encodeURIComponent(CFG.branch)+'&t='+Date.now():'');
  const r=await fetch(url,{method:o.method||'GET',body:o.body,headers:{Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github+json','Content-Type':'application/json'}});
  if(r.status===404&&o.allow404)return null;
  if(!r.ok){let m='';try{m=(await r.json()).message}catch(_){}
    throw new Error('GitHub '+r.status+(m?' : '+m:'')+(r.status===401?' (clé refusée ou expirée)':(r.status===403||r.status===404)?' (droits insuffisants sur le dépôt ?)':''))}
  return r.json();
}
const loadExtras=async()=>{const j=await gh('extras.json',{allow404:true});if(!j){EX_SHA=null;return{}}EX_SHA=j.sha;try{return JSON.parse(b64u8(j.content))}catch(e){return{}}};
const putExtras=async(m,msg)=>{const body={message:msg,content:u8b64(JSON.stringify(m,null,1)),branch:CFG.branch};if(EX_SHA)body.sha=EX_SHA;const r=await gh('extras.json',{method:'PUT',body:JSON.stringify(body)});EX_SHA=r.content.sha};
const onExtras=m=>{const had=EXTRA.length>0;EXTRA=Object.entries(m).map(([id,v])=>({id,...v}));if(had||EXTRA.length)recompute();if(location.hash==='#admin')adminRefresh();else route()};
function setupGH(cfg){
  CFG=cfg;CAN=true;
  DB={doc:p=>{const id=p.split('/')[1];return{
    set:d=>enqueue(async()=>{const m=await loadExtras();m[id]=d;await putExtras(m,'Admin : '+id);onExtras(m)}),
    delete:()=>enqueue(async()=>{const m=await loadExtras();delete m[id];await putExtras(m,'Admin : retrait '+id);onExtras(m)})}}};
  AS={
    upload:async bl=>{
      const id=[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,'0')).join('');const b64=await blobB64(bl);
      await enqueue(()=>gh('img/extra/'+id+'.webp',{method:'PUT',body:JSON.stringify({message:'Admin : image',content:b64,branch:CFG.branch})}));
      LOCAL[id]=URL.createObjectURL(bl);return{id}},
    delete:id=>enqueue(async()=>{const j=await gh('img/extra/'+id+'.webp',{allow404:true});
      if(j)await gh('img/extra/'+id+'.webp',{method:'DELETE',body:JSON.stringify({message:'Admin : retrait image',sha:j.sha,branch:CFG.branch})})})};
  $('adminLink').hidden=false;
  enqueue(async()=>{onExtras(await loadExtras())}).catch(()=>{});
}
function initAdmin(){let c=null;try{c=JSON.parse(localStorage.getItem('f1cfg')||'null')}catch(e){}if(c&&c.token)setupGH(c)}
function adminLogin(){
  let c={};try{c=JSON.parse(localStorage.getItem('f1cfg')||'{}')||{}}catch(e){}
  const h=location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:'',p=location.pathname.split('/').filter(Boolean)[0]||'';
  app.innerHTML=`<h1>Administration</h1><p class="sub">Connectez-vous une seule fois avec votre compte GitHub. Vos informations restent uniquement dans ce navigateur.</p><div id="adMsg" hidden></div>
  <section class="ad"><div class="row2"><div><label>Nom d’utilisateur GitHub</label><input id="gOwner" value="${c.owner||h}"></div><div><label>Nom du dépôt (projet)</label><input id="gRepo" value="${c.repo||(p&&!p.includes('.')?p:'')}"></div>
  <div><label>Branche</label><input id="gBranch" value="${c.branch||'main'}"></div><div><label>Clé d’accès (token)</label><input id="gToken" type="password" value="${c.token||''}"></div></div><button class="sv" id="gGo">Se connecter</button></section>`;
  $('gGo').onclick=async e=>{
    e.target.disabled=true;
    const cfg={owner:$('gOwner').value.trim(),repo:$('gRepo').value.trim(),branch:$('gBranch').value.trim()||'main',token:$('gToken').value.trim()};
    try{
      const r=await fetch('https://api.github.com/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo),{headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json'}});
      if(!r.ok)throw new Error('GitHub '+r.status+' : vérifiez le nom d’utilisateur, le nom du dépôt et la clé.');
      const j=await r.json();
      if(j.permissions&&!j.permissions.push)throw new Error('Cette clé n’a pas le droit de modifier le dépôt (autorisation « Contents : Read and write » manquante).');
      try{localStorage.setItem('f1cfg',JSON.stringify(cfg))}catch(_){}
      setupGH(cfg);admin();say('Connecté. Vous pouvez modifier le site.');
    }catch(x){say(x.message,false);e.target.disabled=false}
  };
}
function adminLogout(){try{localStorage.removeItem('f1cfg')}catch(e){}CAN=false;DB=null;AS=null;CFG=null;$('adminLink').hidden=true;location.hash='#home'}

async function boot(){
  const [d,ex]=await Promise.all([fetch('data.json').then(r=>{if(!r.ok)throw new Error('data.json introuvable ('+r.status+')');return r.json()}),
    fetch('extras.json?t='+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({}))]);
  BASE=d.seasons;DATA=BASE;window.GP=d.gp;window.RC=d.rc;window.NUM=d.num;window.EC=d.ec;
  BASE_GP=window.GP;BASE_RC=window.RC;BASE_NUM=window.NUM;BASE_EC=window.EC;
  EXTRA=Object.entries(ex||{}).map(([id,v])=>({id,...v}));
  if(EXTRA.length)recompute();else index();
  route();initAdmin();
}
boot().catch(e=>{app.innerHTML='<h1>Chargement impossible</h1><p>'+e.message+'</p><p class="sub">Si vous ouvrez le fichier directement depuis votre ordinateur, utilisez plutôt l’adresse en ligne du site.</p>'});
addEventListener('hashchange',route);

function route(){
  const hs=location.hash.slice(1);scrollTo(0,0);
  if(hs.startsWith('season-'))return season(+hs.slice(7));
  if(hs.startsWith('driver-'))return driver(hs.slice(7));
  if(hs.startsWith('team-'))return team(hs.slice(5));
  if(hs==='admin')return admin();
  if(hs==='numbers')return listNum();
  if(hs.startsWith('number-'))return numPage(hs.slice(7));
  if(hs==='podiums')return listGP();
  if(hs.startsWith('gp-'))return gpSeason(+hs.slice(3));
  if(hs.startsWith('race-'))return race(hs.slice(5));
  if(hs==='drivers')return listDrivers();
  if(hs==='teams')return listTeams();
  home();
}
function home(){
  app.innerHTML=`<h1>Saisons de Formule 1</h1><p class="sub">${DATA.length} saisons · ${Object.keys(teams).length} écuries · ${Object.keys(drivers).length} pilotes</p>
  <div class="grid">${DATA.map(s=>`<a class="card" href="#season-${s.year}"><div class="year">${s.year}</div><div class="m">${s.teams.length} écuries · ${s.teams.reduce((a,t)=>a+t.drivers.length,0)} pilotes</div></a>`).join('')}</div>`;
}
function season(y){
  const s=DATA.find(x=>x.year===y);if(!s)return home();
  app.innerHTML=`<h1>Saison ${y}</h1><p class="sub"><a class="link" href="#home">← Toutes les saisons</a></p>${GP[y]?`<p><a class="link" href="#gp-${y}">🏆 Voir les ${GP[y].length} Grands Prix de ${y} →</a></p>`:''}`+s.teams.map(t=>`
  <section class="team"><div class="top"><img class="logo" src="${t.logo}" alt="${t.name}">
    <div><h3 style="margin:0"><a class="link" href="#team-${slug(t.name)}">${t.name}</a></h3><div class="m sub" style="margin:0">${t.chassis} · moteur ${t.engine}</div></div></div>
    <img class="car" src="${t.car}" alt="${t.chassis}" loading="lazy">

  const d=drivers[slug(name)],s=d&&d.seasons.find(x=>x.year===y);
  if(s&&s.number){const m=String(s.number).match(/\d+/);if(m)return m[0]}
  for(const n in NUM)if(NUM[n].some(b=>slug(b.name)===slug(name)))return n;
  return '';
};
function spGroups(t,name,y){
  const out=[],k=slug(name),hid=new Set(EXTRA.filter(e=>e.kind==='hide'&&e.t===t&&slug(e.name)===k&&e.year===y).map(e=>(e.n||'')+'|'+e.gi));
  if(t==='driver'){
    for(const n in BASE_NUM)BASE_NUM[n].forEach(b=>{if(slug(b.name)!==k)return;b.years.forEach(r=>{if(r.y!==y)return;r.s.forEach((g,gi)=>{if(hid.has(n+'|'+gi))return;out.push({src:'base',t,n,gi,name:b.name,year:y,imgs:[g.f,...g.h].filter(Boolean)})})})});
  }else{
    const key=Object.keys(BASE_EC).find(n=>slug(n)===k),r=key&&BASE_EC[key][y];
    (r?r.x:[]).forEach((g,gi)=>{if(hid.has('|'+gi))return;out.push({src:'base',t,gi,name:key,year:y,imgs:[g.f,...g.l].filter(Boolean)})});
  }
  EXTRA.filter(e=>e.kind==='special'&&e.t===t&&slug(e.name)===k&&e.year===y).forEach(e=>out.push({src:'extra',id:e.id,t,name:e.name,year:y,number:e.number,imgs:[e.flag,...(e.imgs||[])].filter(Boolean).map(blob)}));
  return out;
}
async function removeGroup(g){
  if(g.src==='extra'){const e=EXTRA.find(x=>x.id===g.id);await DB.doc('extra/'+g.id).delete();for(const i of assetIds(e||{}))try{await AS.delete(i)}catch(_){}}
  else await DB.doc('extra/hide-'+slug(g.name)+'-'+g.year+'-'+(g.n||'x')+'-'+g.gi).set({kind:'hide',t:g.t,name:g.name,year:g.year,n:g.n||'',gi:g.gi});
}
function tab3(){
  const mod=AM==='mod',typeSel=`<div><label>Type</label><select id="sType"><option value="driver">Casque spécial d’un pilote</option><option value="team">Livrée spéciale d’une écurie</option></select></div>`;
  if(mod){
    $('adBody').innerHTML=`<section class="ad"><h2>Modifier un casque ou une livrée</h2><div class="row2">${typeSel}<div><label>Pilote ou écurie</label><input id="sName" list="dlD"></div></div>${YS('s',false)}<button class="sv" id="show">Afficher</button><div id="sList" style="margin-top:14px"></div></section>`;
    $('sType').onchange=()=>$('sName').setAttribute('list',$('sType').value==='driver'?'dlD':'dlT');
    const show=()=>{
      const g=spGroups($('sType').value,$('sName').value.trim(),+$('sy').value);
      $('sList').innerHTML=g.length?g.map((x,i)=>`<div class="adi">${x.imgs.map(s=>`<img src="${s}" alt="">`).join('')}<div class="grow">${x.src==='extra'?'Ajouté par vous':'Du fichier d’origine'}${x.n?' · #'+x.n:''}</div><button data-r="${i}">Remplacer</button><button data-d="${i}">Supprimer</button></div>`).join(''):'<p class="sub">Aucun élément trouvé pour cette saison. Vérifiez le nom, ou utilisez « Ajouter ».</p>';
      $$('[data-d]',$('sList')).forEach(b=>confirmBtn(b,async()=>{try{await removeGroup(g[+b.dataset.d]);say('Supprimé.');show()}catch(e){say('Échec : '+(e.message||e.code),false)}}));
      $$('[data-r]',$('sList')).forEach(b=>b.onclick=()=>{REPL=g[+b.dataset.r];AM='add';admin();say('Ajoutez les nouvelles images : l’ancien élément sera retiré à l’enregistrement.')});
    };
    $('show').onclick=show;return;
  }
  $('adBody').innerHTML=`<section class="ad"><h2>Ajouter un casque ou une livrée spéciale</h2><div class="row2">${typeSel}<div><label>Nom du pilote ou de l’écurie</label><input id="sName" list="dlD"></div></div><p class="sub" id="sHint"></p>
  ${YS('s',true)}<div class="row2" style="margin-top:6px"><div id="sNumW"><label>Numéro du pilote (obligatoire si le pilote est nouveau)</label><input id="sNum"></div>${F('sFlag','Drapeau du Grand Prix (facultatif)',{file:1})}</div>
  <div class="f"><label>Images du ou des casques / livrées (plusieurs possibles)</label><input id="sImgs" type="file" accept="image/*" multiple></div><button class="sv" id="save">Enregistrer</button></section>`;
  const hint=()=>{
    const t=$('sType').value,raw=$('sName').value.trim();$('sNumW').style.display=t==='driver'?'':'none';$('sName').setAttribute('list',t==='driver'?'dlD':'dlT');
    if(!raw){$('sHint').textContent='';return}
    const known=t==='driver'?drivers[slug(raw)]&&!drivers[slug(raw)].pseudo:Object.values(teams).some(x=>slug(x.name)===slug(raw));
    $('sHint').textContent=known?(t==='driver'?'Pilote connu : le casque sera ajouté automatiquement à sa fiche.':'Écurie connue : la livrée sera ajoutée automatiquement à sa fiche.'):(t==='driver'?'Nouveau pilote : une fiche pilote et un numéro seront créés. Indiquez son numéro.':'Nouvelle écurie : elle sera créée pour cette saison, avec cette livrée.');
  };
  $('sType').onchange=hint;$('sName').oninput=hint;
  if(REPL){$('sType').value=REPL.t;$('sName').value=nice(REPL.name);$('sy').value=REPL.year;if(REPL.n)$('sNum').value=REPL.n;if(REPL.number)$('sNum').value=REPL.number}
  hint();
  $('save').onclick=e=>run(e.target,async()=>{
    const t=$('sType').value,raw=$('sName').value.trim(),y=yearOf('s'),files=[...$('sImgs').files];
    if(!raw||!files.length)throw new Error('Indiquez le nom et choisissez au moins une image.');
    let name,number='';
    if(t==='driver'){
      const k=drivers[slug(raw)];name=k?k.name:fmtName(raw);number=$('sNum').value.replace('#','').trim()||numberFor(name,y);
      if(!/^\d{1,3}$/.test(number))throw new Error('Pilote nouveau ou numéro introuvable : indiquez le numéro (chiffres).');
    }else{const k=Object.values(teams).find(x=>slug(x.name)===slug(raw));name=k?k.name:raw}
    const imgs=[];for(const f of files)imgs.push(await upImg(f,400));
    await DB.doc('extra/sp-'+slug(name)+'-'+y+'-'+Date.now().toString(36)).set({kind:'special',t,name,year:y,number,flag:await upImg($('sFlag').files[0],100),imgs});
    if(REPL){const g=REPL;REPL=null;await removeGroup(g)}
    LASTY=y;['sName','sNum','sFlag','sImgs','any'].forEach(i=>{if($(i))$(i).value=''});$('sny').value='';hint();
  });
}

/* ---------- Historique ---------- */
function adminList(){
  const L=$('adList');if(!L)return;
  const lab=e=>({team:`Écurie ${e.year} · ${e.name}`,gp:`Grand Prix ${e.year} · #${e.n} ${e.country||''}`,
    special:`${e.t==='team'?'Livrée spéciale':'Casque spécial'} ${e.year} · ${nice(e.name||'')}`,hide:`Élément retiré (${e.t==='team'?'livrée':'casque'}) ${e.year} · ${nice(e.name||'')}`,driver:`Pilote ${e.year} · ${nice(e.name||'')}`}[e.kind]||e.id);
  L.innerHTML=EXTRA.length?[...EXTRA].sort((a,b)=>(b.year||0)-(a.year||0)||a.id.localeCompare(b.id)).map(e=>{
    const imgs=assetIds(e).slice(0,4).map(i=>`<img src="${blob(i)}" alt="">`).join('');
    return `<div class="adi">${imgs}<div class="grow">${lab(e)}</div><button data-del="${e.id}">${e.kind==='hide'?'Restaurer':'Supprimer'}</button></div>`}).join(''):'<p class="sub">Aucun ajout pour le moment.</p>';
  $$('[data-del]',L).forEach(b=>confirmBtn(b,async()=>{
    const e=EXTRA.find(x=>x.id===b.dataset.del);if(!e)return;
    try{await DB.doc('extra/'+e.id).delete();for(const i of assetIds(e))try{await AS.delete(i)}catch(_){}say(e.kind==='hide'?'Élément restauré.':'Supprimé.')}catch(x){say('Échec : '+(x.message||x.code),false)}
  }));
}
function listDrivers(){
  const l=Object.entries(drivers).sort((a,b)=>a[1].name.split(' ').slice(-1)[0].localeCompare(b[1].name.split(' ').slice(-1)[0]));
  app.innerHTML=`<h1>Pilotes</h1><p class="sub">${l.length} pilotes</p><div class="grid">${l.map(([k,d])=>{const s=d.seasons.sort((a,b)=>b.year-a.year)[0]||{};return `<a class="card" href="#driver-${k}"><img src="${s.photo||''}" loading="lazy" alt=""><div class="n">${nice(d.name)}</div><div class="m">${d.seasons.length} saison(s)</div></a>`}).join('')}</div>`;
}
function listTeams(){
  const l=Object.entries(teams).sort((a,b)=>a[1].name.localeCompare(b[1].name));
  app.innerHTML=`<h1>Écuries</h1><p class="sub">${l.length} écuries</p><div class="grid">${l.map(([k,t])=>{const s=t.seasons.sort((a,b)=>b.year-a.year)[0];return `<a class="card" href="#team-${k}"><img src="${s.logo}" loading="lazy" alt=""><div class="n">${t.name}</div><div class="m">${t.seasons.length} saison(s)</div></a>`}).join('')}</div>`;
}
$('q').addEventListener('input',e=>{
  const v=slug(e.target.value);if(!v)return route();
  const dr=Object.entries(drivers).filter(([k])=>k.includes(v)),tm=Object.entries(teams).filter(([k])=>k.includes(v));
  app.innerHTML=`<h1>Résultats</h1><div class="grid">`+
   dr.map(([k,d])=>`<a class="card" href="#driver-${k}"><img src="${(d.seasons[0]||{}).photo||''}" alt=""><div class="n">${nice(d.name)}</div><div class="m">Pilote</div></a>`).join('')+
   tm.map(([k,t])=>`<a class="card" href="#team-${k}"><img src="${t.seasons[0].logo}" alt=""><div class="n">${t.name}</div><div class="m">Écurie</div></a>`).join('')+`</div>`;
});
